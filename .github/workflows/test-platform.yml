name: Agent-Driven Test Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-platform:
    name: Synthetic platform quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CI-safe platform tests
        run: npm run test:ci

      - name: Upload safe platform artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-artifacts-${{ github.run_id }}
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
